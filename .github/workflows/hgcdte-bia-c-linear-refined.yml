name: HgCdTe C-linear BIA refined

on:
  push:
    branches:
      - experiment-13-observable-resource-unification
    paths:
      - 'experiments/13-observable-resource-unification/numerics/hgcdte_bia_c_linear_refined.py'
      - 'experiments/13-observable-resource-unification/numerics/hgcdte_bia_c_linear_stress.py'
      - 'experiments/12-oscillator-strength-state-count-bound/numerics/kane_8band_tightness.py'
      - '.github/workflows/hgcdte-bia-c-linear-refined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run refined hierarchy and continuous-capacity audit
        run: |
          python experiments/13-observable-resource-unification/numerics/hgcdte_bia_c_linear_refined.py \
            --carrier-nr 120 --carrier-nmu 10 --carrier-nphi 16 \
            --optical-nr 120 --optical-nmu 10 --optical-nphi 16 \
            --optical-kmax 1.0 \
            | tee bia_c_linear_refined.txt
      - name: Assertions
        shell: bash
        run: |
          grep -q '\[BIA_OFF\]' bia_c_linear_refined.txt
          grep -q '\[C_LINEAR_BIA_ON\]' bia_c_linear_refined.txt
          grep -q 'continuous_capacity_mps=' bia_c_linear_refined.txt
          grep -q 'mean_inverse_selectivity_sampled=' bia_c_linear_refined.txt
          grep -q 'max_selected_adjacent_pair_split_eV=' bia_c_linear_refined.txt
          grep -q 'WARNING: C-linear BIA only' bia_c_linear_refined.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hgcdte-bia-c-linear-refined
          retention-days: 30
          path: bia_c_linear_refined.txt
