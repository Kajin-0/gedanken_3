name: Rev8 flagship PDF

on:
  push:
    branches:
      - experiment-13-observable-resource-unification
    paths:
      - 'experiments/13-observable-resource-unification/typeset/**'
      - '.github/workflows/rev8-flagship-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX and PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-publishers texlive-pictures \
            texlive-fonts-recommended lmodern poppler-utils patch

      - name: Reconstruct frozen Rev4 source
        working-directory: experiments/13-observable-resource-unification/typeset
        run: python3 build_rev4.py

      - name: Reconstruct Rev5
        working-directory: experiments/13-observable-resource-unification/typeset
        shell: bash
        run: |
          set -euo pipefail
          cat rev5_from_rev4.patch.part1 rev5_from_rev4.patch.part2 rev5_from_rev4.patch.part3 > rev5_from_rev4.patch
          patch -o rev5_prapplied.tex rev4_unified_prapplied_built.tex < rev5_from_rev4.patch

      - name: Reconstruct Rev6 and Rev7
        working-directory: experiments/13-observable-resource-unification/typeset
        run: |
          python3 build_rev6.py
          python3 build_rev7.py

      - name: Apply Rev8 BIA robustness upgrade
        working-directory: experiments/13-observable-resource-unification/typeset
        run: |
          python3 build_rev8.py
          grep -Fq 'homogeneous $B_{8v}^{+}/B_{8v}^{-}/C_k$' rev8_prapplied.tex
          grep -Fq '40452 one-dimensional BIA-split shells' rev8_prapplied.tex
          grep -Fq '0.82\%' rev8_prapplied.tex
          grep -Fq 'Li2017HgTeBIA' rev8_prapplied.tex
          grep -Fq '\bibliography{rev4_unified,rev8_extra}' rev8_prapplied.tex

      - name: Compile REVTeX manuscript
        working-directory: experiments/13-observable-resource-unification/typeset
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error rev8_prapplied.tex

      - name: Production QA summary
        working-directory: experiments/13-observable-resource-unification/typeset
        shell: bash
        run: |
          set -o pipefail
          PDF=rev8_prapplied.pdf
          LOG=rev8_prapplied.log
          mkdir -p rev8_rendered_pages
          pdftoppm -png -r 180 "$PDF" rev8_rendered_pages/page >/dev/null 2>&1
          {
            echo 'Experiment 13 Rev8 production QA'
            echo "commit: $GITHUB_SHA"
            echo
            pdfinfo "$PDF" | grep -E '^(Pages|Page size|PDF version):' || true
            echo
            sha256sum rev8_prapplied.tex "$PDF" rev4_unified.bib rev8_extra.bib rev8_figures.tex build_rev8.py
            echo
            echo 'Undefined-reference/citation warnings:'
            grep -Ei 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' "$LOG" || echo 'none'
            echo
            echo 'Overfull/underfull boxes:'
            grep -E 'Overfull|Underfull' "$LOG" || echo 'none'
            echo
            echo 'LaTeX warnings:'
            grep -E 'LaTeX Warning|Package .* Warning' "$LOG" || echo 'none'
          } | tee REV8_PRODUCTION_QA.txt

          if grep -Eqi 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' "$LOG"; then exit 1; fi
          if grep -Eq 'Overfull \\hbox|Overfull \\vbox' "$LOG"; then exit 1; fi

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: experiment13-rev8-production
          if-no-files-found: error
          retention-days: 30
          path: |
            experiments/13-observable-resource-unification/typeset/rev8_prapplied.pdf
            experiments/13-observable-resource-unification/typeset/rev8_prapplied.tex
            experiments/13-observable-resource-unification/typeset/rev8_prapplied.log
            experiments/13-observable-resource-unification/typeset/rev8_prapplied.bbl
            experiments/13-observable-resource-unification/typeset/rev8_figures.tex
            experiments/13-observable-resource-unification/typeset/rev8_extra.bib
            experiments/13-observable-resource-unification/typeset/build_rev8.py
            experiments/13-observable-resource-unification/typeset/REV8_PRODUCTION_QA.txt
            experiments/13-observable-resource-unification/typeset/rev8_rendered_pages/*.png
