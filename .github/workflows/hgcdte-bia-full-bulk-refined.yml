name: HgCdTe full homogeneous BIA refined

on:
  push:
    branches:
      - experiment-13-observable-resource-unification
    paths:
      - 'experiments/13-observable-resource-unification/numerics/hgcdte_bia_full_bulk_refined.py'
      - 'experiments/13-observable-resource-unification/numerics/hgcdte_bia_full_bulk.py'
      - 'experiments/13-observable-resource-unification/numerics/hgcdte_bia_c_linear_refined.py'
      - 'experiments/13-observable-resource-unification/numerics/hgcdte_bia_c_linear_stress.py'
      - 'experiments/12-oscillator-strength-state-count-bound/numerics/kane_8band_tightness.py'
      - '.github/workflows/hgcdte-bia-full-bulk-refined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refined:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run five-case refined hierarchy audit
        run: |
          python experiments/13-observable-resource-unification/numerics/hgcdte_bia_full_bulk_refined.py \
            --carrier-nr 120 --carrier-nmu 10 --carrier-nphi 16 \
            --optical-nr 120 --optical-nmu 10 --optical-nphi 16 \
            --optical-kmax 1.0 \
            | tee hgcdte_bia_full_bulk_refined.txt
      - name: Require all cases and exact-shell diagnostics
        shell: bash
        run: |
          for label in BIA_OFF GAMMA8_C_ONLY COMPLETE_C_K BPLUS_BMINUS_ONLY FULL_BPLUS_BMINUS_CK; do
            grep -q "\[$label\]" hgcdte_bia_full_bulk_refined.txt
          done
          grep -q '^\[RELATIVE_TO_BIA_OFF\]$' hgcdte_bia_full_bulk_refined.txt
          grep -q '^\[INCREMENTAL_TERM_EFFECTS\]$' hgcdte_bia_full_bulk_refined.txt
          grep -q 'mean_inverse_selectivity_sampled=' hgcdte_bia_full_bulk_refined.txt
          grep -q 'continuous_capacity_mps=' hgcdte_bia_full_bulk_refined.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: hgcdte-bia-full-bulk-refined
          retention-days: 30
          path: hgcdte_bia_full_bulk_refined.txt
